# Public pipeline settings. Personal values live in private/profile.yaml.
pilot:
  prepare_per_day: 3
  submit_cap_per_day: 5

lanes:
  radiochem:
    name: Radiochemistry / radiopharma QC
    keywords: [radiochem*, radiopharm*, radioligand*, radiotracer*, radiolabel*, radioisotope*, "nuclear pharmacy", PET, SPECT, HPLC-RAD, radio-TLC, isotope*]
  analytical:
    name: Analytical chemistry and method validation
    keywords: [analytical chemist, analytical scientist, method validation, method development, method transfer, HPLC, GC, chromatography, QC chemist, QC analyst, ICH Q2]
  el:
    name: Extractables and leachables
    keywords: [extractable*, leachable*, "E&L", "container closure", "USP <1663>", "USP <1664>", "USP 1663", "USP 1664"]
  qa:
    name: QA / GxP compliance
    keywords: [quality assurance, QA specialist, GMP compliance, GxP, quality systems, CAPA, deviation, document control, validation specialist, data integrity]

scout:
  # Searched on feeds that support keyword search (Workday, Phenom, SmartRecruiters).
  search_terms: [chemist, analytical, quality, QC, QA, validation, radiochemistry, radiopharmaceutical, extractables, GMP, compliance, scientist]
  # Title rules (whole words, case-insensitive; a word ending in * matches as a prefix). In order:
  #   1. any title_exclude word -> drop
  #   2. a supply/logistics word -> keep only with a development/start-up word too
  #   3. a lab word -> keep
  #   4. a QA word -> keep only without a seniority word (associate and mid-level QA only)
  #   5. otherwise drop
  title_lab: [chemist, chemistry, analytical, QC, "quality control", laboratory, lab, scientist, "research associate",
              HPLC, "LC/MS", LC-MS, LCMS, GC, GC-MS, chromatography, bioanalytical, spectroscopy, "mass spec*",
              radiochem*, radiopharm*, radioligand*, radiolabel*, radiation, radioisotope*, isotope*, cyclotron, PET, nuclear,
              extractable*, leachable*, "E&L", stability, method*, validation, CMC, formulation*, "drug product",
              "product development", assay*, bioassay*, immunoassay*, ADA, PK, biomarker*, metrology, microbiolog*]
  title_qa: ["quality assurance", QA, compliance, "quality systems", audit*, "quality operations", "quality specialist",
             "quality engineer", "quality associate", "quality analyst"]
  title_senior: [senior, sr, lead, principal, manager, head, staff, expert, specialist III, "associate III"]
  title_supply: [supply, logistics, planner, planning, procurement, buyer, "materials management", sourcing]
  title_development: [development, start-up, startup, implementation, commissioning, launch, "new facility", "tech transfer",
                      "technology transfer", build-out, buildout]
  # Any of these drops the title. Director level and above is out of scope.
  title_exclude: [director, "vice president", VP, SVP, EVP, chief, president, head,
                  intern, internship, co-op, student, "graduate program", "new grad", rotation*, apprentice*,
                  sales, marketing, "account manager", driver, nurse, physician, pharmacist, technologist,
                  "medical science liaison", "clinical research associate", "clinical study", software, "data scientist",
                  "machine learning", finance, accountant, recruiter, "human resources", postdoc, "post-doc", fellow,
                  "field service", warehouse, "medical director", "medical affairs", "regulatory affairs", "data manager",
                  IT, SAP, "business system*", "systems analyst", architect, "computer system*", CSV, "product manager",
                  "project manager", "program manager", "risk management",
                  "senior manager", "sr manager", "sr. manager", "senior principal", advisor, expert,
                  clinical, patholog*, histolog*, "medical lab*", MLT, "field application*", "application scientist",
                  "applications specialist", commercial, informatics, AI, agentic, computational, modeling, modelling,
                  digital, "post doctoral", postdoctoral, "post-doctoral", clerk, trainee, biorepository,
                  "disease biology", "antibody discovery", oncology, "translational", "process engineer", "upstream",
                  thesis, "automation engineer", mobile, freelance*, cytolog*, genomic*, game*, tester, playtest*]
  max_age_days: 30
  repost_window_days: 60
  # Drive times come from OSRM without traffic; within this many minutes of the limit is flagged "borderline".
  borderline_minutes: 5

# Alternative track: roles that use Alex's transferable skills (AI, management, documentation),
# outside the lab. Same hard rules as the lab track (age, commute/remote, pay, level, shifts).
alt:
  prepare_per_day: 3
  lanes:
    ai:
      name: AI implementation and automation
      keywords: [AI, "artificial intelligence", LLM, "generative AI", GenAI, "machine learning", agent*, automation, "prompt engineer*", copilot, "AI enablement", "AI adoption", "AI solutions"]
    pm:
      name: Project and program management
      keywords: ["project manag*", "program manag*", PMO, "project coordinat*", "project lead", scrum, agile, "delivery manag*", "implementation manag*"]
    writing:
      name: Technical writing and documentation
      keywords: ["technical writ*", documentation, "document control", "content develop*", "SOP", "standard operating procedure*", "procedure writ*"]
    consulting:
      name: Consulting and implementation
      keywords: [consultant, consulting, "implementation", "solutions engineer*", "customer success", advisory, "professional services"]
    informatics:
      name: Lab informatics and data
      keywords: [LIMS, informatics, ELN, "data integrity", "laboratory systems", Benchling, LabWare, LabVantage, "data analyst", Python]
    operations:
      name: Operations, assets and supply
      keywords: ["operations manag*", "lab operations", "facilit*", "asset manag*", "equipment manag*", "vendor manag*", "supply chain", procurement]
    techqa:
      name: Software and game QA
      keywords: ["QA tester", "quality assurance tester", "game test*", "software test*", "test analyst", "QA analyst", "playtest*"]
  search_terms: [AI, "artificial intelligence", automation, "project manager", "program manager", "technical writer",
                 documentation, consultant, implementation, LIMS, informatics, "operations manager", "QA tester"]
  # A title must contain one of these (same matching rules as the lab track).
  title_include: [AI, "artificial intelligence", "machine learning", LLM, GenAI, automation, agent*, "prompt",
                  "project manag*", "program manag*", "project coordinat*", "project lead", PMO, scrum,
                  "technical writ*", writer, documentation, "document control", "content",
                  consultant, consulting, implementation, "solutions", "customer success", advisor,
                  LIMS, informatics, ELN, "systems analyst", "data analyst", "business analyst",
                  "operations", "facilit*", "asset", "equipment", "vendor", "supply chain",
                  "QA tester", "test analyst", "game test*", "software test*", "QA analyst", playtest*, trainer, "subject matter expert", SME]
  title_exclude: [director, "vice president", VP, SVP, EVP, chief, president, head, "senior manager", "sr manager", "sr. manager",
                  intern, internship, co-op, student, "graduate program", "new grad", apprentice*, sales, "account executive",
                  "account manager", "business development", driver, nurse, physician, pharmacist, technologist, clinical,
                  recruiter, "human resources", payroll, accountant, finance, "field service", warehouse, "forklift",
                  "medical", "regulatory affairs", thesis, freelance*, "software engineer", "senior engineer", "staff engineer",
                  "principal engineer", architect, "data scientist", "machine learning engineer", devops, "site reliability",
                  backend, "back-end", frontend, "front-end", "full stack", "full-stack", "data engineer", "ML engineer",
                  "AI engineer", "research engineer", "research scientist", developer, software, SRE, "security engineer"]

screener:
  model: sonnet
  batch_size: 4            # jobs per Claude call; each call has ~1.5k tokens of fixed overhead
  max_jobs_per_run: 24     # safety cap on Claude usage per night
  min_fit: 60              # below this a job is not queued for preparation (pilot value; tune from rejections)
  # Ranking = fit score + these adjustments. Lab lanes first; QA is the lowest priority.
  lane_bonus: {radiochem: 10, analytical: 6, el: 6, dev_supply: 3, qa: -8, other: -10}
  alt_lane_bonus: {ai: 10, pm: 7, writing: 7, consulting: 7, informatics: 4, operations: 2, techqa: 0, other: -10}
  fresh_bonus: 5           # posted within 3 days
  near_bonus: 3            # remote or within 15 minutes

tailor:
  model: sonnet
  verify_model: sonnet
  max_bullets_per_role: 6

submitter:
  # Pilot: stop at the Review page and wait for Alex's "Submit" tap on the dashboard.
  # Set to true once the filled forms have proven right; then an approved application is
  # submitted directly whenever every answer came from the answer bank.
  auto_submit: false
  headed: true             # a visible browser is less likely to be blocked than a headless one

schedule:
  nightly_prepare: "02:00"
  submit_runs: ["12:00", "18:00"]
  inbox_every_minutes: 30
  inbox_hours: ["08:00", "18:00"]
  morning_email: "07:00"
